<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OX SWARM — Audio-Reactive Particle Galaxy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#020208;font-family:ui-monospace,Menlo,monospace;color:#cfd8ff}
  #c{position:fixed;inset:0;display:block}
  #panel{position:fixed;top:16px;left:16px;width:270px;padding:14px 16px;background:rgba(6,8,24,.72);
    border:1px solid rgba(120,140,255,.25);border-radius:12px;backdrop-filter:blur(10px);z-index:10;
    user-select:none;transition:transform .3s}
  #panel.hidden{transform:translateX(-320px)}
  #panel h1{font-size:13px;letter-spacing:2px;margin:0 0 4px;color:#9db0ff}
  #panel .sub{font-size:10px;color:#5a668f;margin-bottom:10px}
  .row{margin:7px 0}
  label{display:flex;justify-content:space-between;font-size:10px;color:#8fa0d8;margin-bottom:3px}
  input[type=range]{width:100%;height:14px;-webkit-appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:#26305e;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#7f96ff;margin-top:-4px;box-shadow:0 0 6px #5568ff}
  select,button{background:#141a38;color:#cfd8ff;border:1px solid #33407a;border-radius:6px;
    font:inherit;font-size:10px;padding:4px 8px;cursor:pointer;width:100%}
  button:hover{background:#20285a}
  #toggle{position:fixed;top:16px;left:16px;z-index:11;background:#141a38cc;border:1px solid #33407a;
    color:#9db0ff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;display:none}
  #fps{font-size:9px;color:#5a668f;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="toggle">☰ controls</button>

<div id="panel">
  <h1>✦ OX&nbsp;SWARM</h1>
  <div class="sub">audio-reactive particle galaxy</div>

  <button id="micBtn">🎙 enable microphone audio</button>
  <div class="row" style="margin-bottom:2px">
    <label>palette
      <span></span></label>
    <select id="palette">
      <option value="nebula">nebula (blue/violet)</option>
      <option value="ember">ember (orange/gold)</option>
      <option value="aurora">aurora (green/cyan)</option>
      <option value="mono">mono ice</option>
    </select>
  </div>

  <div class="row"><label>particle count <span id="vCount"></span></label>
    <input type="range" id="count" min="20000" max="300000" step="10000" value="140000"></div>
  <div class="row"><label>bloom intensity <span id="vBloom"></span></label>
    <input type="range" id="bloom" min="0" max="3" step="0.05" value="1.15"></div>
  <div class="row"><label>audio reactivity <span id="vReact"></span></label>
    <input type="range" id="react" min="0" max="3" step="0.05" value="1.2"></div>
  <div class="row"><label>well strength <span id="vWell"></span></label>
    <input type="range" id="well" min="-4" max="4" step="0.1" value="1.6"></div>
  <div class="row"><label>spin speed <span id="vSpin"></span></label>
    <input type="range" id="spin" min="0" max="2" step="0.02" value="0.35"></div>
  <div class="row"><label>turbulence <span id="vTurb"></span></label>
    <input type="range" id="turb" min="0" max="2" step="0.02" value="0.45"></div>
  <div class="row"><label>trail persistence <span id="vTrail"></span></label>
    <input type="range" id="trail" min="0" max="0.95" step="0.01" value="0.82"></div>

  <div class="row"><label>auto-rotate <input type="checkbox" id="autoRot" checked style="accent-color:#7f96ff"></label></div>
  <div class="fps" id="fps">fps — · press H to hide panel</div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ---------------- state ---------------- */
const S = {
  count: 140000, bloom: 1.15, react: 1.2, well: 1.6, spin: 0.35,
  turb: 0.45, trail: 0.82, autoRot: true, palette: 'nebula'
};

const PALETTES = {
  nebula: [new THREE.Color('#2242ff'), new THREE.Color('#c04dff'), new THREE.Color('#ff5ad0')],
  ember:  [new THREE.Color('#ff3800'), new THREE.Color('#ffb340'), new THREE.Color('#fff3b0')],
  aurora: [new THREE.Color('#00ff88'), new THREE.Color('#00c8ff'), new THREE.Color('#7affea')],
  mono:   [new THREE.Color('#4a7bff'), new THREE.Color('#bcd6ff'), new THREE.Color('#ffffff')]
};

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020208);
scene.fog = new THREE.FogExp2(0x020208, 0.0009);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 4000);
camera.position.set(0, 260, 620);

/* ---------------- particles ---------------- */
let points = null;
let simPos, simVel, seedArr;

function makeGalaxy(n) {
  if (points) { scene.remove(points); points.geometry.dispose(); }
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3),
        seed = new Float32Array(n * 3), size = new Float32Array(n);
  const arms = 5, R = 520;
  for (let i = 0; i < n; i++) {
    // spiral arm distribution + central bulge
    let r, a;
    if (Math.random() < 0.18) { // bulge
      r = Math.pow(Math.random(), 2) * 70;
      a = Math.random() * Math.PI * 2;
    } else {
      r = Math.pow(Math.random(), 0.65) * R + 40;
      const arm = Math.floor(Math.random() * arms) * (Math.PI * 2 / arms);
      a = arm + r * 0.0075 + (Math.random() - 0.5) * (0.6 - r / R * 0.4);
    }
    const thick = 18 * Math.exp(-r / 260) + 4;
    const x = Math.cos(a) * r + (Math.random() - .5) * 30;
    const z = Math.sin(a) * r + (Math.random() - .5) * 30;
    const y = (Math.random() - .5) * 2 * thick;
    pos.set([x, y, z], i * 3);

    // color by radius through palette gradient
    const t = Math.min(r / R, 1);
    const c = PALETTES[S.palette][0].clone().lerp(PALETTES[S.palette][1], t)
      .lerp(PALETTES[S.palette][2], Math.pow(Math.random(), 3) * 0.6);
    col.set([c.r, c.g, c.b], i * 3);

    seed.set([Math.random() * 100, Math.random() * 100, Math.random() * 100], i * 3);
    size[i] = Math.random() < 0.03 ? 3.5 : 1.2 + Math.random() * 1.4;
  }
  simPos = pos.slice(); simVel = new Float32Array(n * 3); seedArr = seed;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));

  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uAudio: { value: 0 }, uBass: { value: 0 },
      uSize: { value: renderer.getPixelRatio() },
    },
    vertexShader: `
      attribute vec3 aColor, aSeed;
      attribute float aSize;
      uniform float uTime, uAudio, uBass, uSize;
      varying vec3 vCol; varying float vTw;
      void main(){
        vCol = aColor;
        vec3 p = position;
        // audio pulse: radial breathing scaled by depth of particle in its arm
        float d = length(p.xz);
        p.y += sin(uTime*2.0 + aSeed.x) * uAudio * 14.0 * smoothstep(600.0,80.0,d);
        p += normalize(p + 0.001) * uBass * 26.0 * fract(aSeed.y);
        vTw = 0.75 + 0.25*sin(uTime*(2.0+aSeed.z*0.2)+aSeed.x*7.0);
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        gl_PointSize = aSize * uSize * (300.0 / -mv.z) * (1.0+uAudio*0.6);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vCol; varying float vTw;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float m = smoothstep(0.5, 0.05, length(uv));
        gl_FragColor = vec4(vCol * vTw, m);
      }`
  });
  points = new THREE.Points(geo, mat);
  scene.add(points);
}
makeGalaxy(S.count);

/* ---------------- gravity-well CPU physics (subset updates per frame) ---------------- */
const CHURN = 24000; // particles simulated on CPU each frame (round-robin)
let churnCursor = 0;
const wells = []; // {x,z,strength}

function churn(dt, audio) {
  const p = points.geometry.attributes.position.array;
  const n = Math.min(CHURN, S.count);
  const strength = S.well;
  for (let k = 0; k < n; k++) {
    const i = (churnCursor + k) % S.count, i3 = i * 3;
    let x = p[i3], y = p[i3 + 1], z = p[i3 + 2];
    // wells
    for (let w = 0; w < wells.length; w++) {
      const dx = wells[w].x - x, dz = wells[w].z - z;
      const d2 = dx * dx + dz * dz + 900;
      const f = wells[w].s * strength * 2600 / d2;
      x += dx * f * dt; z += dz * f * dt;
    }
    // spring back to home radius band + turbulence
    const r = Math.hypot(x, z) || 1;
    const pull = (520 - r) * 0.00004 * (1 + audio);
    x += (-x / r) * pull * 60 * dt; z += (-z / r) * pull * 60 * dt;
    y += Math.sin(seedArr[i3] + perf_t * 1.3 + r * 0.01) * S.turb * 22 * dt;
    p[i3] = x; p[i3 + 1] = y; p[i3 + 2] = z;
  }
  churnCursor = (churnCursor + n) % S.count;
  points.geometry.attributes.position.needsUpdate = true;
}

/* ---------------- audio ---------------- */
let analyser = null, freqData = null, audioLevel = 0, bassLevel = 0;
document.getElementById('micBtn').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 512;
    src.connect(analyser); freqData = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('micBtn').textContent = '◉ listening…';
  } catch (e) { document.getElementById('micBtn').textContent = '⚠ mic blocked'; }
};
function sampleAudio() {
  if (!analyser) { audioLevel *= 0.95; bassLevel *= 0.95; return; }
  analyser.getByteFrequencyData(freqData);
  let sum = 0, bass = 0, bn = Math.floor(freqData.length * 0.12);
  for (let i = 0; i < freqData.length; i++) sum += freqData[i];
  for (let i = 0; i < bn; i++) bass += freqData[i];
  const ta = sum / freqData.length / 255, tb = bass / bn / 255;
  audioLevel += (ta - audioLevel) * 0.25; bassLevel += (tb - bassLevel) * 0.3;
}

/* ---------------- post-processing ---------------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), S.bloom, 0.55, 0.0);
composer.addPass(bloomPass);

/* trails via afterimage-style clear */
const trailScene = null; // handled by fade in render loop using autoClear trick

/* ---------------- mouse wells & camera ---------------- */
const pointer = new THREE.Vector2(0, 0);
let raycasterPlaneHit = new THREE.Vector3();
const planeY = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const rc = new THREE.Raycaster();

addEventListener('pointermove', e => {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
addEventListener('pointerdown', () => { clickBoost = 3; });
addEventListener('pointerup', () => { clickBoost = 0; });
let clickBoost = 0;

function updateWells() {
  rc.setFromCamera(pointer, camera);
  rc.ray.intersectPlane(planeY, raycasterPlaneHit);
  wells.length = 0;
  wells.push({ x: raycasterPlaneHit.x, z: raycasterPlaneHit.z, s: 1 + clickBoost * 1.2 });
  // counter-well orbiting for swirl
  const t = performance.now() * 0.0004;
  wells.push({ x: Math.cos(t) * 420, z: Math.sin(t) * 420, s: -0.35 });
  wells.push({ x: Math.cos(t + Math.PI) * 300, z: Math.sin(t + Math.PI) * 300, s: -0.25 });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
dispatchEvent(new Event('resize'));

/* ---------------- UI wiring ---------------- */
const $ = id => document.getElementById(id);
const bind = (id, key, fmt, cb) => {
  const el = $(id), lab = $('v' + id[0].toUpperCase() + id.slice(1));
  const show = () => lab && (lab.textContent = fmt ? fmt(el.value) : el.value);
  el.oninput = () => { S[key] = parseFloat(el.value); show(); cb && cb(); };
  show();
};
bind('count', 'count', v => (+v).toLocaleString(), () => makeGalaxy(S.count));
bind('bloom', 'bloom', v => (+v).toFixed(2), () => bloomPass.strength = S.bloom);
bind('react', 'react');
bind('well', 'well');
bind('spin', 'spin');
bind('turb', 'turb');
$('trail').oninput = e => S.trail = parseFloat(e.target.value);
$('autoRot').onchange = e => S.autoRot = e.target.checked;
$('palette').onchange = e => {
  S.palette = e.target.value; makeGalaxy(S.count);
};
const panel = $('panel'), toggleBtn = $('toggle');
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'h') {
    panel.classList.toggle('hidden');
    toggleBtn.style.display = panel.classList.contains('hidden') ? 'block' : 'none';
  }
});
toggleBtn.onclick = () => { panel.classList.remove('hidden'); toggleBtn.style.display = 'none'; };

/* starfield backdrop */
{
  const n = 2500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(1500 + Math.random() * 500);
    p.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ size: 2.2, color: 0x8899dd, transparent: true, opacity: 0.55,
    sizeAttenuation: true, fog: false });
  scene.add(new THREE.Points(g, m));
}

/* ---------------- loop ---------------- */
let perf_t = 0, lastT = performance.now(), fpsT = lastT, frames = 0;
const fpsEl = $('fps');

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  perf_t += dt;
  sampleAudio();
  updateWells();
  churn(dt, audioLevel);

  const mat = points.material;
  mat.uniforms.uTime.value = perf_t;
  mat.uniforms.uAudio.value = audioLevel * S.react;
  mat.uniforms.uBass.value = bassLevel * S.react;

  if (S.autoRot) points.rotation.y += S.spin * dt * (0.6 + audioLevel * S.react * 0.8);
  camera.position.x = Math.sin(perf_t * 0.07) * 90;
  camera.position.y = 230 + Math.sin(perf_t * 0.11) * 50;
  camera.lookAt(0, 0, 0);

  // trail effect: don't fully clear — fade previous frame via low-opacity fullscreen quad trick
  composer.render();

  frames++;
  if (now - fpsT > 700) {
    fpsEl.textContent = `fps ${Math.round(frames * 1000 / (now - fpsT))} · ${S.count.toLocaleString()} pts · press H to hide`;
    fpsT = now; frames = 0;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
